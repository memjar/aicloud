[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aicloud-api"
version = "0.1.0"
description = "AI inference backend API"

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.104.0"
uvicorn = { version = "^0.24.0", extras = ["standard"] }
gunicorn = "^21.2.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
httpx = "^0.25.0"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.6"

# Database
psycopg2-binary = "^2.9.0"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
alembic = "^1.13.0"

# Caching & Sessions
redis = "^5.0.0"
aioredis = "^2.0.1"

# AI Provider SDKs
openai = "^1.3.0"
anthropic = "^0.7.0"
together = "^0.2.0"

# Payments
stripe = "^7.4.0"

# Authentication & Security
PyJWT = "^2.8.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }

# Logging & Monitoring
python-json-logger = "^2.0.0"
structlog = "^23.2.0"
sentry-sdk = "^1.39.0"

# Observability
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"

# Email
email-validator = "^2.1.0"
jinja2 = "^3.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
httpx-mock = "^0.30.0"
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
isort = "^5.13.0"
ipython = "^8.17.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
